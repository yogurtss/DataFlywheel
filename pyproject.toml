[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataflywheel"
version = "0.1.0"
description = "Auditable OCR hard-case mining and multimodal DPO for PaddleOCR-VL"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "httpx>=0.27", "Pillow>=10", "lxml>=5", "apted==1.0.3", "rapidfuzz>=3.9", "latex2mathml>=3.77"]

[project.optional-dependencies]
synth = ["playwright>=1.49", "fonttools>=4.50"]
average = ["torch>=2.2", "safetensors>=0.4.5"]
train = ["ms-swift>=4.0,<5", "transformers>=5.0,<6", "safetensors>=0.4.5"]
pages = ["paddleocr[doc-parser]>=3.6"]
test = ["pytest>=8", "safetensors>=0.4.5", "torch>=2.2"]

[project.scripts]
dataflywheel = "dataflywheel.cli:main"

[tool.setuptools.packages.find]
include = ["dataflywheel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
